async function extractPdfLines(file) {
  const buf = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
  const allLines = [];
  for (let p = 1; p <= pdf.numPages; p++) {
    const page = await pdf.getPage(p);
    const content = await page.getTextContent();
    const items = content.items.map((it) => ({ text: it.str, x: it.transform[4], y: it.transform[5] }));
    const buckets = {};
    items.forEach((it) => {
      const key = Math.round(it.y / 3) * 3;
      (buckets[key] = buckets[key] || []).push(it);
    });
    const keys = Object.keys(buckets).map(Number).sort((a, b) => b - a);
    const used = new Set();
    for (let i = 0; i < keys.length; i++) {
      const k = keys[i];
      if (used.has(k)) continue;
      const row = buckets[k].slice().sort((a, b) => a.x - b.x);
      let text = row.map((w) => w.text).join(" ");
      if (i + 1 < keys.length && k - keys[i + 1] <= 8) {
        const nxt = buckets[keys[i + 1]];
        const totalLen = nxt.reduce((s, w) => s + w.text.length, 0);
        if (totalLen <= 8) {
          text += " " + nxt.slice().sort((a, b) => a.x - b.x).map((w) => w.text).join(" ");
          used.add(keys[i + 1]);
        }
      }
      allLines.push(text);
    }
  }
  return allLines.join("\n");
}

function parseStages(full) {
  const lines = full.split("\n").map((l) => l.trim());
  const stages = [];
  let t = 0;
  let pendingLabel = null;
  for (const line of lines) {
    if (/^(Stage\s*\d+|Recovery)$/i.test(line)) { pendingLabel = line; continue; }
    const isRest = /^Rest\b/i.test(line);
    const isLabeledData = pendingLabel && /\d/.test(line);
    if (isRest || isLabeledData) {
      const nums = line.match(/-?\d+\.?\d*/g) || [];
      let vo2Idx = -1;
      for (let i = 0; i < nums.length; i++) {
        if (nums[i].includes(".") && parseFloat(nums[i]) < 90) { vo2Idx = i; break; }
      }
      if (vo2Idx > 0) {
        const vo2 = parseFloat(nums[vo2Idx]);
        const hr = parseInt(nums[vo2Idx - 1], 10);
        if (!Number.isNaN(hr) && !Number.isNaN(vo2)) {
          stages.push({ t, hr, vo2, speed: (isRest ? 0 : (parseFloat(nums[0]) || 0)), label: pendingLabel || "Rest" });
          t += 2;
        }
      }
      pendingLabel = null;
    }
  }
  return stages.length ? stages : null;
}
function parseRecommendations(full) {
  const idx = full.search(/each week:/i);
  if (idx === -1) return null;
  const tail = full.slice(idx);
  const stopIdx = tail.search(/Please let me know|Kind regards/i);
  const block = stopIdx !== -1 ? tail.slice(0, stopIdx) : tail;
  const blocks = [...block.matchAll(/•\s*([^\n•]+?)\s*\n?((?:\s*o\s+[^\n•]+)+)/gi)];
  if (!blocks.length) return null;
  return blocks.map((b) => ({
    exercise: b[1].trim(),
    detail: b[2].replace(/\s*o\s+/g, " | ").replace(/^\s*\|\s*/, "").replace(/\s+/g, " ").trim(),
  }));
}

/* ---------- ventilatory equivalents scatter: sample data (made-up, not a real athlete) ---------- */
function synthVentSample() {
  let seed = 7;
  const rnd = () => { seed = (seed * 16807) % 2147483647; return seed / 2147483647; };
  const a = [], b = [];
  for (let i = 0; i < 107; i++) {
    const t = i * 0.255;
    const f = t / 27.3;
    const vo = 24 + 7 * Math.max(0, f - 0.55) / 0.45 + 2.5 * Math.min(1, f / 0.5) + (rnd() - 0.5) * 5;
    const vc = 32 + 4.5 * Math.max(0, f - 0.75) / 0.25 - 1.2 * Math.min(1, f / 0.5) + (rnd() - 0.5) * 3.6;
    a.push([Math.round(t * 100) / 100, Math.round(vo * 10) / 10]);
    b.push([Math.round(t * 100) / 100, Math.round(vc * 10) / 10]);
  }
  return { veq1: a, veq2: b };
}
function parseClock(str) {
  const t = String(str == null ? "" : str).trim();

  const m = t.match(/^(\d+):(\d{1,2})(?::(\d{1,2}))?$/);
  if (m) return m[3] != null ? (+m[1]) * 60 + (+m[2]) + (+m[3]) / 60 : (+m[1]) + (+m[2]) / 60;
  const v = parseFloat(t.replace(",", "."));
  return Number.isFinite(v) ? v : null;
}

  const s = Math.round(min * 60);
  return String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0");
}
function parseVentPaste(text) {
  const a = [], b = [];
  String(text || "").split(/\r?\n/).forEach((line) => {
    const parts = line.trim().split(/[\t,; ]+/).filter(Boolean);
    if (parts.length < 2) return;
    const t = parseClock(parts[0]);
    const v1 = parseFloat(parts[1]);

}

/* Reads the coloured dot markers straight from the page's drawing instructions (exact, no overlap problems) */
async function vectorDots(page, vp) {
  const OPS = pdfjsLib.OPS;
  const fillOps = [OPS.fill, OPS.eoFill, OPS.fillStroke, OPS.eoFillStroke, OPS.closeFillStroke, OPS.closeEOFillStroke];
  const ol = await page.getOperatorList();
  let ctm = [1, 0, 0, 1, 0, 0];
  const stack = [];
  let rgb = [0, 0, 0];
  let pending = null;
  const out = { orange: [], blue: [] };
  const emit = (bb) => {
    const wd = bb[2] - bb[0], ht = bb[3] - bb[1];
    if (!(wd > 0.5 && wd < 9 && ht > 0.5 && ht < 9)) return;
    const m = pdfjsLib.Util.transform(vp.transform, ctm);
    const cx = (bb[0] + bb[2]) / 2, cy = (bb[1] + bb[3]) / 2;
    const pt = [m[0] * cx + m[2] * cy + m[4], m[1] * cx + m[3] * cy + m[5]];
    const r = rgb[0], g = rgb[1], b = rgb[2];
    if (r > 200 && g > 90 && g < 165 && b < 110) out.orange.push(pt);
    else if (b > 170 && r < 150 && g > 110 && g < 195) out.blue.push(pt);
  };
  for (let i = 0; i < ol.fnArray.length; i++) {
    const fn = ol.fnArray[i], a = ol.argsArray[i];
    if (fn === OPS.save) stack.push(ctm.slice());
    else if (fn === OPS.restore) { if (stack.length) ctm = stack.pop(); }
    else if (fn === OPS.transform) ctm = pdfjsLib.Util.transform(ctm, a);
    else if (fn === OPS.setFillRGBColor) {
      if (typeof a[0] === "string") { const h = a[0].replace("#", ""); rgb = [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)]; }
      else rgb = [a[0], a[1], a[2]];
    } else if (fn === OPS.constructPath) {
      if (typeof a[0] === "number") {
        const mm = a[2];
        if (mm && fillOps.indexOf(a[0]) >= 0) emit([mm[0], mm[1], mm[2], mm[3]]);
        pending = null;
      } else {
        const o = a[0], c = a[1];
        const xs = [], ys = [];
        let k = 0;
        const add = (x, y) => { xs.push(x); ys.push(y); };
        for (let q = 0; q < o.length; q++) {
          const op = o[q];
          if (op === OPS.moveTo || op === OPS.lineTo) { add(c[k], c[k + 1]); k += 2; }
          else if (op === OPS.curveTo) { add(c[k], c[k + 1]); add(c[k + 2], c[k + 3]); add(c[k + 4], c[k + 5]); k += 6; }
          else if (op === OPS.curveTo2 || op === OPS.curveTo3) { add(c[k], c[k + 1]); add(c[k + 2], c[k + 3]); k += 4; }
          else if (op === OPS.rectangle) { add(c[k], c[k + 1]); add(c[k] + c[k + 2], c[k + 1] + c[k + 3]); k += 4; }
        }
        pending = xs.length ? [Math.min.apply(null, xs), Math.min.apply(null, ys), Math.max.apply(null, xs), Math.max.apply(null, ys)] : null;
      }
    } else if (fillOps.indexOf(fn) >= 0 && pending) { emit(pending); pending = null; }
  }
  return out;
}

/* Reads the dots of the "ventilatory equivalent" chart out of an imported PDF by looking at the rendered chart */
async function extractVentEquivalents(file) {
  try {
    const buf = await file.arrayBuffer();
    const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
    for (let p = 1; p <= pdf.numPages; p++) {
      const page = await pdf.getPage(p);
      const content = await page.getTextContent();
      if (!/Ventilatory\s*Equivalent/i.test(content.items.map((i) => i.str).join(" "))) continue;
      const scale = 3;
      const vp = page.getViewport({ scale: scale });
      const canvas = document.createElement("canvas");
      canvas.width = Math.ceil(vp.width); canvas.height = Math.ceil(vp.height);
      const ctx = canvas.getContext("2d", { willReadFrequently: true });
      await page.render({ canvasContext: ctx, viewport: vp }).promise;
      const labs = content.items.filter((i) => i.str && i.str.trim()).map((i) => {
        const t = pdfjsLib.Util.transform(vp.transform, i.transform);
        const h = Math.abs(t[3]) || Math.hypot(t[2], t[3]);
        return { str: i.str.trim(), cx: t[4] + (i.width * scale) / 2, cy: t[5] - 0.35 * h, h: h };
      });
      const xl = labs.filter((l) => /^\d{1,2}:\d{2}$/.test(l.str));
      if (xl.length < 3) continue;
      let xRow = [];
      xl.forEach((l) => { const same = xl.filter((o) => Math.abs(o.cy - l.cy) < 4); if (same.length > xRow.length) xRow = same; });
      if (xRow.length < 4) continue;
      const rowY = xRow.reduce((m, l) => m + l.cy, 0) / xRow.length;
      const xMin = xRow.reduce((m, l) => (l.cx < m.cx ? l : m), xRow[0]);
      const xMax = xRow.reduce((m, l) => (l.cx > m.cx ? l : m), xRow[0]);
      const yCand = labs.filter((l) => /^\d+(\.\d+)?$/.test(l.str) && l.cy < rowY - 6 && l.cx < xMin.cx - 4);
      if (yCand.length < 2) continue;
      const colX = yCand.reduce((m, l) => Math.max(m, l.cx), 0);
      const yl = yCand.filter((l) => Math.abs(l.cx - colX) < 14);
      if (yl.length < 2) continue;
      const yLo = yl.reduce((m, l) => (parseFloat(l.str) < parseFloat(m.str) ? l : m), yl[0]);
      const yHi = yl.reduce((m, l) => (parseFloat(l.str) > parseFloat(m.str) ? l : m), yl[0]);
      const tOf = (px) => parseClock(xMin.str) + ((px - xMin.cx) / (xMax.cx - xMin.cx)) * (parseClock(xMax.str) - parseClock(xMin.str));
      const vOf = (py) => parseFloat(yLo.str) + ((py - yLo.cy) / (yHi.cy - yLo.cy)) * (parseFloat(yHi.str) - parseFloat(yLo.str));
      const x0 = Math.floor(xMin.cx - 14), x1 = Math.ceil(xMax.cx + 14);
      const y0 = Math.floor(yHi.cy - 14), y1 = Math.ceil(yLo.cy + 14);
      const w = x1 - x0, hh = y1 - y0;
      const img = ctx.getImageData(x0, y0, w, hh).data;
      const cls = new Uint8Array(w * hh);
      for (let i = 0; i < w * hh; i++) {
        const r = img[i * 4], g = img[i * 4 + 1], bl = img[i * 4 + 2];
        if (r > 200 && g > 90 && g < 165 && bl < 110) cls[i] = 1;
        else if (bl > 170 && r < 150 && g > 110 && g < 195) cls[i] = 2;
      }
      const seen = new Uint8Array(w * hh);
      const blobs = { 1: [], 2: [] };
      for (let i = 0; i < w * hh; i++) {
        if (!cls[i] || seen[i]) continue;
        const k = cls[i]; const stack = [i]; seen[i] = 1;
        let n = 0, sx = 0, sy = 0, minx = w, maxx = 0;
        while (stack.length) {

          n++; sx += qx; sy += qy; if (qx < minx) minx = qx; if (qx > maxx) maxx = qx;
          for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
            const nx = qx + dx, ny = qy + dy;
            if (nx < 0 || ny < 0 || nx >= w || ny >= hh) continue;
            const ni = ny * w + nx;
            if (cls[ni] === k && !seen[ni]) { seen[ni] = 1; stack.push(ni); }
          }
        }
        if (n >= 8) blobs[k].push({ n: n, cx: sx / n + x0, cy: sy / n + y0, minx: minx + x0, maxx: maxx + x0 });
      }
      const toPts = (arr) => {
        if (!arr.length) return [];
        const areas = arr.map((b) => b.n).sort((a, b) => a - b);
        const med = areas[Math.floor(areas.length / 2)];
        const out = [];
        arr.forEach((b) => {
          const k = Math.max(1, Math.min(4, Math.round(b.n / med)));

            const px = k === 1 ? b.cx : b.minx + ((j + 0.5) / k) * (b.maxx - b.minx);
            out.push([Math.round(tOf(px) * 100) / 100, Math.round(vOf(b.cy) * 10) / 10]);
          }

        return out.sort((a, b) => a[0] - b[0]);
      };
      let veq1 = toPts(blobs[2]), veq2 = toPts(blobs[1]);
      try {
        const vd = await vectorDots(page, vp);
        const inside = (pt) => pt[0] >= x0 - 20 && pt[0] <= x1 + 20 && pt[1] >= y0 - 20 && pt[1] <= y1 && pt[1] < rowY - 10;
        const conv = (arr) => arr.filter(inside).map((pt) => [Math.round(tOf(pt[0]) * 100) / 100, Math.round(vOf(pt[1]) * 10) / 10]).sort((m, n) => m[0] - n[0]);

      // vertical threshold lines: dark columns spanning most of the plot height
      const cols = [];
      const top = Math.max(0, Math.floor(yHi.cy - y0)), bot = Math.min(hh, Math.ceil(yLo.cy - y0));
      for (let cx = 0; cx < w; cx++) {
        let dark = 0;
        for (let cy = top; cy < bot; cy++) { const o = (cy * w + cx) * 4; if (img[o] < 70 && img[o + 1] < 70 && img[o + 2] < 70) dark++; }
        if (dark > (bot - top) * 0.6) cols.push(cx);
      }
      const lines = [];
      cols.forEach((c) => { const last = lines[lines.length - 1]; if (last && c - last.end <= 2) { last.end = c; } else lines.push({ start: c, end: c }); });
      const lt = lines.map((l) => Math.round(tOf((l.start + l.end) / 2 + x0) * 100) / 100).sort((a, b) => a - b);
      return { veq1: veq1, veq2: veq2, vt1Time: lt.length >= 2 ? lt[0] : null, vt2Time: lt.length >= 2 ? lt[1] : null };
    }
  } catch (err) { /* the chart is optional: ignore any failure */ }
  return null;
}

  const step = (f <= 1 ? 1 : f <= 2 ? 2 : f <= 5 ? 5 : 10) * pow;
  const lo = Math.floor(min / step + 1e-9) * step;
  const hi = Math.ceil(max / step - 1e-9) * step;
  const ticks = [];
  for (let v = lo; v <= hi + step / 2; v += step) ticks.push(Math.round(v * 1000) / 1000);
  return { lo, hi, ticks };
}

/* ---------- performance report: PDF detection + parsing ---------- */
function detectReportType(full) {
  const performanceSignals = [/Athlete Details/i, /Sport\s*\/\s*Event/i, /Ventilatory Thresholds/i, /Lactate Thresholds/i,
    /VO\s*2\s*Max Assessment Report/i, /Sports Performance Clinics/i, /\bVT1\b/, /\bLT1\b/];
  const clinicalSignals = [/Gas Exchange Threshold/i, /percentile/i, /Exercise history and goals/i, /Stature/i, /predicted/i];
  const p = performanceSignals.filter((r) => r.test(full)).length;
  const c = clinicalSignals.filter((r) => r.test(full)).length;
  return p >= 3 && p > c ? "performance" : "clinical";
}
function parsePerformanceReport(full) {
  const text = full.replace(/VO\s+2/g, "VO2");
  const grab = (re) => { const m = text.match(re); return m ? m[1].trim() : null; };
  const fixUnits = (s) => (s ? s.replace(/VO\s+2/g, "VO2").replace(/km\.h(?![\w\u207b\u00b9\-])/g, "km.h\u207b\u00b9") : s);
  const tidy = (s) => (s ? s.replace(/\s*\n\s*/g, " ").replace(/\s+/g, " ").trim() : null);
  const lines = text.split("\n").map((l) => l.trim()).filter(Boolean);

  // athlete details
  const dateM = text.match(/Date:\s*(\d{1,2})\/(\d{1,2})\/(\d{4})/i);
  const testDate = dateM && Number(dateM[2]) >= 1 && Number(dateM[2]) <= 12
    ? `${Number(dateM[1])} ${MONTHS[Number(dateM[2]) - 1]} ${dateM[3]}` : null;
  const client = {
    name: grab(/Name:\s*([^\n]+)/i),
    sex: grab(/(?:Gender|Sex):\s*([A-Za-z]+)/i),
    height: grab(/Height\s*\(cm\):\s*([\d.]+)/i),
    weight: grab(/Body Mass\s*\(kg\):\s*([\d.]+)/i),
    tester: grab(/Physiologist:\s*([^\n]+)/i),
    testDate,
  };
  const testMode = /treadmill/i.test(text) ? "treadmill" : (/cycle|bike|cycling|ergometer/i.test(text) ? "bike" : "treadmill");

  // stage-by-stage table
  const rowRe = /^(\d{1,2}(?:\.\d+)?)\s+(\d{1,2}:\d{2})\s+(\d{2,3})\s+([\d.]+)\s+([\d.]+)\s+([\d.]+)\s+([\d.]+)\s+(-|\d+)\s+(-|[\d.]+)\s+([\d.]+)\s+([\d.]+)\s+(\d+)$/;
  const stages = [];
  let pendingNote = "";
  lines.forEach((line) => {
    if (/VO2\s*max protocol/i.test(line)) { pendingNote = "VO2max protocol, 2-min stages"; return; }
    const m = line.match(rowRe);
    if (m) {
      stages.push({
        speed: m[1], pace: m[2], hr: m[3], hrPct: m[4], vo2: m[5], vo2L: m[6], vo2Pct: m[7],
        rpe: m[8] === "-" ? "" : m[8], lactate: m[9] === "-" ? "" : m[9], ve: m[10], rer: m[11], rf: m[12], note: pendingNote,
      });
      pendingNote = "";
    }
  });
  const last = stages.length ? stages[stages.length - 1] : null;

  // VO2 max row: "56.4 4.43 188 3:20"
  let vo2Ml = null, vo2L = null, hrMax = null, vPace = null;
  lines.forEach((line) => {
    const m = line.match(/^([\d.]+)\s+([\d.]+)\s+(\d{2,3})\s+(\d{1,2}:\d{2})$/);
    if (m && !vo2Ml) { vo2Ml = m[1]; vo2L = m[2]; hrMax = m[3]; vPace = m[4]; }
  });
  if (!vo2Ml && last) { vo2Ml = last.vo2; vo2L = last.vo2L; hrMax = last.hr; vPace = last.pace; }
  const vSpeedX = vPace ? paceToX(vPace) : null;
  const vSpeed = last ? last.speed : (vSpeedX ? String(Math.round(vSpeedX * 10) / 10) : null);

  // threshold rows (VT: "47.6 (+5.4) 84.3 167 88.8 4:17", LT: "46.6 82.6 162 86.2 4:26")
  const thrRe = /(?:^|\s)([\d.]+)(?:\s*\(\s*([+\-±]?\s*[\d.]+)\s*\))?\s+([\d.]+)\s+(\d{2,3})\s+([\d.]+)\s+([2-9]:\d{2})(?=\s|$)/g;
  const section = (startRe, endRe) => {
    const s = text.search(startRe);
    if (s === -1) return "";
    const rest = text.slice(s + 1);
    const e = rest.search(endRe);
    return e === -1 ? rest : rest.slice(0, e);
  };
  const vtSeg = section(/Ventilatory Thresholds\s*\(VT1\s*\/\s*VT2\)/i, /Lactate Thresholds\s*\(LT1/i);
  const ltSeg = section(/Lactate Thresholds\s*\(LT1\s*\/\s*LT2\)/i, /Training Zones\s*(?:\n|$)/i);
  const vt = [...vtSeg.matchAll(thrRe)].slice(0, 2).map((m) => ({
    vo2: m[1], vo2Plus: m[2] ? m[2].replace(/\s+/g, "") : "", pctVo2: m[3], hr: m[4], pctHr: m[5], pace: m[6],
  }));
  const lt = [...ltSeg.matchAll(thrRe)].slice(0, 2).map((m) => ({
    vo2: m[1], pctVo2: m[3], hr: m[4], pctHr: m[5], pace: m[6],
  }));

  // training zones. Descriptions can land on separate lines, so match them back by order.
  const zStart = text.search(/(?:^|\n)\s*Training Zones\s*(?:\n|$)/i);
  const zoneRows = [];
  const orphans = [];
  if (zStart !== -1) {
    text.slice(zStart).split("\n").map((l) => l.trim()).filter(Boolean).forEach((line) => {
      const m = line.match(/^Zone\s*(\d)\s+(.*)$/i);
      if (m) zoneRows.push({ n: m[1], rest: m[2] });
      else if (/^[A-Za-z][A-Za-z ]*$/.test(line) && line.split(" ").length <= 4
        && !/^(Training Zone|HR range|Perceived|Critical|Exertion|duration|Description|Pace)/i.test(line)) orphans.push(line);
    });
  }
  const dash = /\s*[–—-]\s*/;
  const zones = zoneRows.map((zr) => {
    const paceM = zr.rest.match(/([<>])?\s*(\d{1,2})\s*:\s*(\d{2})(?:\s*[–—-]\s*(\d{1,2})\s*:\s*(\d{2}))?/);
    if (!paceM) return null;
    const pre = zr.rest.slice(0, paceM.index).trim();
    const after = zr.rest.slice(paceM.index + paceM[0].length);
    const hrM = after.match(/([<>])?\s*(\d{2,3})(?:\s*[–—-]\s*(\d{2,3}))?/);
    if (!hrM) return null;
    const post = after.slice(hrM.index + hrM[0].length);
    const durM = post.match(/([<>])?\s*\d+(?:\s*[–—-]\s*\d+)?\s*(?:hr|min)s?/i);
    const effort = (durM ? post.slice(0, durM.index) : post).trim();
    return {
      zone: `Zone ${zr.n}`,
      name: pre.replace(/VO\s*2/g, "VO2"),
      pace: paceM[4] ? `${paceM[2]}:${paceM[3]} – ${paceM[4]}:${paceM[5]}` : `${paceM[1] || ""}${paceM[2]}:${paceM[3]}`,
      hr: hrM[3] ? `${hrM[2]} – ${hrM[3]}` : `${hrM[1] || ""}${hrM[2]}`,
      effort,
      duration: durM ? durM[0].replace(/\s+/g, "").replace(dash, "–") : "",
    };
  }).filter(Boolean);
  let oi = 0;
  zones.forEach((z) => { if (!z.name && oi < orphans.length) { z.name = orphans[oi]; oi++; } });

  const perf = {
    age: grab(/Age:\s*(\d{1,3})/i),
    sport: grab(/Sport\s*\/\s*Event:\s*([^\n]+)/i),
    testDescription: fixUnits(tidy((text.match(/Test\(s\):\s*([\s\S]*?)\n\s*Protocol:/i) || [])[1])),
    protocol: fixUnits(tidy((text.match(/Protocol:\s*([\s\S]*?)(?=\n\s*Incremental Test Results|$)/i) || [])[1])),
    vo2Ml, vo2L, hrMax, vSpeed, vPace,
    vt: vt.length === 2 ? vt : null,
    lt: lt.length === 2 ? lt : null,
    zones: zones.length ? zones : null,
    stages: stages.length ? stages : null,
  };
  return { client, perf, testMode };
}

function AutoGrowTextarea({ value, onChange, placeholder, minHeight = 120, fontSize = 14.5, id }) {
  const ref = useRef(null);
  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    el.style.height = "auto";
    el.style.height = el.scrollHeight + "px";
  }, [value]);
  return (
    <textarea
      ref={ref}
      id={id}
      value={value}
      onChange={(e) => onChange(e.target.value)}
      placeholder={placeholder}
      className="no-print"
      rows={1}
      style={{
        width: "100%", minHeight: minHeight, fontSize: fontSize, lineHeight: 1.6, color: C.ink, background: "transparent",
        border: `1px dashed ${C.line}`, borderRadius: 8, padding: 10, fontFamily: "inherit",
        resize: "none", overflow: "hidden", boxSizing: "border-box",
      }}
    />
  );
}

function usePersistedChoice(key, initial, allowed) {
  const [val, setVal] = useState(() => {
    try {
      const v = window.localStorage.getItem(key);
      if (v && allowed.indexOf(v) !== -1) return v;
    } catch (e) { /* storage unavailable: fall back to the default */ }
    return initial;
  });
  useEffect(() => {
    try { window.localStorage.setItem(key, val); } catch (e) { /* ignore */ }
  }, [key, val]);
  return [val, setVal];
}

function VO2Hero({ results, category, litres, pr }) {
  const hasP = !!pr;
  const p = hasP ? Math.max(0, Math.min(100, pr.pct)) : 0;
  const bands = [
    { label: "Very poor", from: 0, to: 20, col: C.sand },
    { label: "Poor", from: 20, to: 40, col: C.amber },
    { label: "Fair", from: 40, to: 60, col: C.coral },
    { label: "Good", from: 60, to: 80, col: C.teal },
    { label: "Excellent", from: 80, to: 95, col: C.tealDark },
    { label: "Superior", from: 95, to: 100, col: C.blue },
  ];
  const active = Math.max(0, bands.findIndex((b) => b.label === category.label));
  const word = results.testOutcome === "peak" ? "VO2peak" : "VO2max";
  const bi = Math.max(0, Math.min(bands.length - 1, bands.findIndex((b, i) => p >= b.from && (p < b.to || i === bands.length - 1))));
  const pin = Math.min(94, Math.max(6, ((bi + (p - bands[bi].from) / (bands[bi].to - bands[bi].from)) / bands.length) * 100));
  return (
    <div className="avoid-break" style={{ border: `1px solid ${C.line}`, borderRadius: 14, padding: "20px 24px 18px", marginBottom: 26, background: C.surface }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-end", gap: 16, flexWrap: "wrap" }}>
        <div>
          <div style={{ fontSize: 11, fontWeight: 700, letterSpacing: "0.07em", textTransform: "uppercase", color: C.inkMuted, marginBottom: 2 }}>Your {word}</div>
          <div style={{ display: "flex", alignItems: "baseline", gap: 8 }}>
            <span style={{ fontFamily: "'Space Grotesk', system-ui, sans-serif", fontWeight: 700, fontSize: 54, lineHeight: 1, color: C.ink, fontVariantNumeric: "tabular-nums" }}>{results.vo2max}</span>
            <span style={{ fontSize: 14, color: C.inkMuted }}>ml/kg/min</span>
            {litres ? <span style={{ fontSize: 14, color: C.inkFaint }}>· {litres} L/min</span> : null}
          </div>
        </div>
        {hasP ? (
          <div style={{ textAlign: "right", display: "flex", flexDirection: "column", alignItems: "flex-end", gap: 7 }}>
            <div>
              <span style={{ fontFamily: "'Space Grotesk', system-ui, sans-serif", fontWeight: 700, fontSize: 28, lineHeight: 1, color: C.ink, fontVariantNumeric: "tabular-nums" }}>{pr.text}</span>
              <span style={{ fontSize: 14, fontWeight: 600, color: C.ink, marginLeft: 6 }}>percentile</span>
              <div style={{ fontSize: 12, color: C.inkMuted, marginTop: 2 }}>for your age and sex</div>
            </div>
            <div style={{ display: "inline-block", background: bands[active].col, color: "#fff", fontWeight: 700, fontSize: 13, padding: "5px 14px", borderRadius: 16 }}>{category.label} aerobic fitness</div>
          </div>
        ) : null}
      </div>
      {hasP ? (
        <div style={{ marginTop: 22 }}>
          <div style={{ position: "relative", height: 34 }}>
            <div style={{ position: "absolute", left: `${pin}%`, top: 0, transform: "translateX(-50%)", textAlign: "center" }}>
              <div style={{ fontSize: 11.5, fontWeight: 700, color: C.ink, whiteSpace: "nowrap" }}>You: {pr.text}</div>
              <div style={{ width: 0, height: 0, margin: "2px auto 0", borderLeft: "6px solid transparent", borderRight: "6px solid transparent", borderTop: `8px solid ${C.ink}` }} />
            </div>
          </div>
          <div style={{ display: "flex", gap: 3 }}>
            {bands.map((b, i) => (
              <div key={i} style={{ flex: 1 }}>
                <div style={{ height: 12, borderRadius: i === 0 ? "6px 2px 2px 6px" : i === bands.length - 1 ? "2px 6px 6px 2px" : 2, background: b.col, opacity: i === active ? 1 : 0.35 }} />

/* ---------- hand-rolled trend chart (no external chart library) ---------- */
function TrendChart({ stages, get1, get2, vo2max }) {
  const data = stages.filter((s) => s.t !== "" && s.vo2 !== "" && !Number.isNaN(Number(s.t)) && !Number.isNaN(Number(s.vo2)))
    .map((s) => ({ ...s, t: Number(s.t), vo2: Number(s.vo2) }));
  if (data.length < 2) return null;
  const W = 640, H = 224, padL = 48, padR = 10, padT = 14, padB = 40;
  const maxT = Math.max(...data.map((d) => d.t)) || 1;
  const g1 = Number(get1), g2 = Number(get2);
  const maxVo2 = Math.max(Number(vo2max) || 0, ...data.map((d) => d.vo2)) * 1.08 || 1;
  const x = (t) => padL + (t / maxT) * (W - padL - padR);
  const y = (v) => (H - padB) - (v / maxVo2) * (H - padB - padT);
  const pathD = data.map((d, i) => `${i === 0 ? "M" : "L"} ${x(d.t).toFixed(1)} ${y(d.vo2).toFixed(1)}`).join(" ");
  return (
    <div style={{ marginTop: 8 }}>
      <svg viewBox={`0 0 ${W} ${H}`} width="100%" height={H} style={{ overflow: "visible" }}>
        {!Number.isNaN(g1) && <rect x={padL} y={y(g1)} width={W - padL - padR} height={(H - padB) - y(g1)} fill={C.blue} opacity="0.10" />}
        {!Number.isNaN(g1) && !Number.isNaN(g2) && <rect x={padL} y={y(g2)} width={W - padL - padR} height={y(g1) - y(g2)} fill={C.teal} opacity="0.11" />}
        {!Number.isNaN(g2) && <rect x={padL} y={padT} width={W - padL - padR} height={y(g2) - padT} fill={C.coral} opacity="0.24" />}
        {[0, 0.25, 0.5, 0.75, 1].map((f, i) => (
          <text key={i} x={padL - 6} y={y(maxVo2 * f) + 3} textAnchor="end" fontSize="10" fill={C.inkFaint}>{Math.round(maxVo2 * f)}</text>
        ))}
        {data.map((d, i) => (i % 2 === 0 || i === data.length - 1) && (
          <text key={i} x={x(d.t)} y={H - 24} textAnchor="middle" fontSize="10" fill={C.inkFaint}>{Number.isInteger(d.t) ? `${d.t}m` : secToClock(Math.round(d.t * 60))}</text>
        ))}
        {!Number.isNaN(g1) && <line x1={padL} x2={W - padR} y1={y(g1)} y2={y(g1)} stroke={C.blue} strokeDasharray="4 3" />}
        {!Number.isNaN(g1) && <text x={padL + 4} y={y(g1) - 4} fontSize="10" fill={C.blue}>Threshold 1</text>}
        {!Number.isNaN(g2) && <line x1={padL} x2={W - padR} y1={y(g2)} y2={y(g2)} stroke={C.coral} strokeDasharray="4 3" />}
        {!Number.isNaN(g2) && <text x={padL + 4} y={y(g2) - 4} fontSize="10" fill={C.coral}>Threshold 2</text>}
        <text x={padL + (W - padL - padR) / 2} y={H - 4} textAnchor="middle" fontSize="11" fontWeight="600" fill={C.inkMuted}>Time (minutes)</text>
        <text transform={`translate(11 ${padT + (H - padB - padT) / 2}) rotate(-90)`} textAnchor="middle" fontSize="11" fontWeight="600" fill={C.inkMuted}>Oxygen use (ml/kg/min)</text>
        <path d={pathD} fill="none" stroke={C.tealDark} strokeWidth="2.5" />
        {data.map((d, i) => <circle key={i} cx={x(d.t)} cy={y(d.vo2)} r="2.5" fill={C.tealDark} />)}
      </svg>
      <div style={{ display: "flex", gap: 16, fontSize: 11, color: C.inkFaint, marginTop: 4, flexWrap: "wrap" }}>
        <span><span style={{ display: "inline-block", width: 10, height: 10, background: C.blue, opacity: 0.3, marginRight: 5, borderRadius: 2 }} />Easy — all-day pace</span>
        <span><span style={{ display: "inline-block", width: 10, height: 10, background: C.teal, opacity: 0.3, marginRight: 5, borderRadius: 2 }} />Moderate — sustainable effort</span>
        <span><span style={{ display: "inline-block", width: 10, height: 10, background: C.coral, opacity: 0.5, marginRight: 5, borderRadius: 2 }} />Hard — near maximal</span>
      </div>
    </div>
  );
}

          <DefinitionBox term="Threshold 2 (Gas Exchange Threshold 2, or GET2)">is the second shift in that balance. It is linked to the upper limit of prolonged aerobic performance, where your body uses both aerobic and anaerobic energy while still coping with the by-products. In practice it is the highest intensity you can sustain for short to moderate durations.</DefinitionBox>

function parseRec(detail) {
  let t = String(detail || "");
  const take = (re) => { const m = t.match(re); if (m) { t = t.replace(m[0], " "); } return m; };
  const freq = take(/(\d+(?:\s*[\u2013-]\s*\d+)?)\s*(?:x|\u00d7|times)\s*(?:per|a|\/)\s*week/i);
  const sets = take(/(\d+(?:\s*[\u2013-]\s*\d+)?)\s*sets?/i);
  const reps = take(/(\d+(?:\s*[\u2013-]\s*\d+)?)\s*reps?/i);
  const rest = t.replace(/\bof\b/gi, " ").replace(/[,;]+/g, " ").replace(/\s+/g, " ").trim();
  return { sets: sets && sets[1].replace(/\s/g, ""), reps: reps && reps[1].replace(/\s/g, ""), freq: freq && freq[1].replace(/\s/g, ""), rest };
}
function normRec(rec) {
  if (rec && ("sets" in rec || "reps" in rec || "perWeek" in rec || "note" in rec)) {
    return { sets: String(rec.sets || ""), reps: String(rec.reps || ""), freq: String(rec.perWeek || ""), rest: String(rec.note || "") };
  }
  const p = parseRec(rec && rec.detail);
  return { sets: p.sets || "", reps: p.reps || "", freq: p.freq || "", rest: p.rest || "" };
}
function PlanCard({ rec }) {
  const p = normRec(rec);
  const known = p.sets || p.reps || p.freq;
  const fallback = !known && !p.rest ? rec.detail : "";
  const nDots = p.freq ? Math.min(7, parseInt(String(p.freq).split(/[\u2013-]/).pop(), 10) || 0) : 0;
  const nLow = p.freq ? Math.min(7, parseInt(String(p.freq).split(/[\u2013-]/)[0], 10) || 0) : 0;
  const tile = (label, val, suffix) => (
    <div style={{ background: C.surface, border: `1px solid ${C.line}`, borderRadius: 8, padding: "6px 12px", minWidth: 84, textAlign: "center" }}>
      <div style={{ fontSize: 10, fontWeight: 700, letterSpacing: "0.06em", textTransform: "uppercase", color: C.inkFaint }}>{label}</div>
      <div style={{ fontSize: 18, fontWeight: 700, color: C.ink, fontFamily: "'Space Grotesk', system-ui, sans-serif", fontVariantNumeric: "tabular-nums" }}>{val}{suffix ? <span style={{ fontSize: 12, fontWeight: 600, color: C.inkMuted }}>{suffix}</span> : null}</div>
    </div>
  );
  return (
    <div className="avoid-break" style={{ padding: "12px 14px", background: C.bg, borderRadius: 10, borderLeft: `4px solid ${C.teal}` }}>
      <div style={{ fontSize: 14, fontWeight: 700, color: C.ink }}>{rec.exercise}</div>
      {known ? (
        <div style={{ display: "flex", gap: 8, flexWrap: "wrap", alignItems: "stretch", marginTop: 10 }}>
          {p.sets ? tile("Sets", p.sets) : null}
          {p.reps ? tile("Reps", p.reps) : null}
          {p.freq ? (
            <div style={{ background: C.surface, border: `1px solid ${C.line}`, borderRadius: 8, padding: "6px 12px", minWidth: 100, textAlign: "center" }}>
              <div style={{ fontSize: 10, fontWeight: 700, letterSpacing: "0.06em", textTransform: "uppercase", color: C.inkFaint }}>Per week</div>
              <div style={{ fontSize: 18, fontWeight: 700, color: C.ink, fontFamily: "'Space Grotesk', system-ui, sans-serif" }}>{p.freq}<span style={{ fontSize: 12, fontWeight: 600, color: C.inkMuted }}>{"\u00d7"}</span></div>
              {nDots ? (
                <div style={{ display: "flex", gap: 3, justifyContent: "center", marginTop: 2 }}>
                  {[0, 1, 2, 3, 4, 5, 6].map((d) => <span key={d} style={{ width: 7, height: 7, borderRadius: 4, background: d < nLow ? C.teal : d < nDots ? `${C.teal}66` : C.line, display: "inline-block" }} />)}
                </div>
              ) : null}
            </div>
          ) : null}
        </div>
      ) : null}
      {(!known && (rec.detail || p.rest)) ? <div style={{ fontSize: 12.5, color: C.inkMuted, marginTop: 4 }}>{p.rest || rec.detail}</div> : null}
      {(known && p.rest) ? <div style={{ fontSize: 12.5, color: C.inkMuted, marginTop: 8 }}>{p.rest}</div> : null}
    </div>
  );
}

/* ---------- performance report: charts and tables ---------- */
// Two series against speed (or power), each with its own axis, plus vertical threshold markers.
function VentScatter({ veq1, veq2, vt1, vt2 }) {
  const a = (veq1 || []).filter((p) => p && Number.isFinite(p[0]) && Number.isFinite(p[1]));
  const b = (veq2 || []).filter((p) => p && Number.isFinite(p[0]) && Number.isFinite(p[1]));
  if (a.length + b.length < 6) return null;
  const all = a.concat(b);
  const tMax = Math.max.apply(null, all.map((p) => p[0]).concat([vt1 || 0, vt2 || 0]));
  const step = tMax <= 12 ? 1 : tMax <= 24 ? 2 : tMax <= 40 ? 3 : 5;
  const xHi = Math.ceil(tMax / step) * step;
  const xTicks = []; for (let v = 0; v <= xHi + 1e-9; v += step) xTicks.push(v);
  const ys = niceScale(0, Math.max.apply(null, all.map((p) => p[1])), 5);
  const W = 640, H = 290, padL = 50, padR = 16, padT = 30, padB = 42;
  const X = (v) => padL + (v / xHi) * (W - padL - padR);
  const Y = (v) => (H - padB) - ((v - ys.lo) / (ys.hi - ys.lo)) * (H - padB - padT);
  const midY = (padT + H - padB) / 2;
  const lines = [[vt1, "VT1"], [vt2, "VT2"]].filter((l) => Number.isFinite(l[0]));
  return (
    <div style={{ marginTop: 10 }}>
      <svg viewBox={`0 0 ${W} ${H}`} width="100%" role="img" aria-label="Ventilatory equivalents over the test, with VT1 and VT2 marked" style={{ display: "block" }}>
        {ys.ticks.map((t, i) => (
          <g key={`y${i}`}>
            <line x1={padL} x2={W - padR} y1={Y(t)} y2={Y(t)} stroke={C.line} />
            <text x={padL - 6} y={Y(t) + 3} textAnchor="end" fontSize="10" fill={C.inkMuted}>{t}</text>
          </g>
        ))}
        {xTicks.map((t, i) => (
          <text key={`x${i}`} x={X(t)} y={H - padB + 15} textAnchor="middle" fontSize="10" fill={C.inkFaint}>{fmtClock(t)}</text>
        ))}
        <text x={(padL + W - padR) / 2} y={H - 8} textAnchor="middle" fontSize="11" fill={C.inkMuted}>Time (min)</text>
        <text transform={`rotate(-90 12 ${midY})`} x="12" y={midY} textAnchor="middle" fontSize="11" fill={C.inkMuted}>Ventilatory equivalents (L/min)</text>
        {a.map((p, i) => <circle key={`a${i}`} cx={X(p[0])} cy={Y(p[1])} r="3" fill={C.blue} opacity="0.85" />)}
        {b.map((p, i) => <circle key={`b${i}`} cx={X(p[0])} cy={Y(p[1])} r="3" fill={C.teal} opacity="0.85" />)}
        {lines.map((l, i) => (
          <g key={`m${i}`}>
            <line x1={X(l[0])} x2={X(l[0])} y1={padT - 6} y2={H - padB} stroke={C.ink} strokeWidth="1.5" />
            <text x={X(l[0])} y={padT - 11} textAnchor="middle" fontSize="10.5" fontWeight="700" fill={C.ink}>{l[1]}</text>
          </g>
        ))}
      </svg>
      <div style={{ display: "flex", gap: 18, fontSize: 11.5, color: C.inkMuted, marginTop: 6, flexWrap: "wrap" }}>
        <span><span style={{ display: "inline-block", width: 9, height: 9, borderRadius: "50%", background: C.blue, marginRight: 6 }} />Air breathed per unit of oxygen (VE/VO2)</span>
        <span><span style={{ display: "inline-block", width: 9, height: 9, borderRadius: "50%", background: C.teal, marginRight: 6 }} />Air breathed per unit of carbon dioxide (VE/VCO2)</span>
        {lines.length > 0 && <span>Vertical lines mark your thresholds</span>}
      </div>
    </div>
  );
}

function SpeedChart({ rows, leftKey, leftLabel, leftColor, rightKey, rightLabel, rightColor, markers, xLabel, ariaLabel }) {
  const pts = rows.map((r) => ({ x: num(r.speed), l: num(r[leftKey]), r: num(r[rightKey]) })).filter((p) => p.x !== null);
  const lp = pts.filter((p) => p.l !== null);
  const rp = pts.filter((p) => p.r !== null);
  if (lp.length < 2) return null;
  const mk = (markers || []).filter((m) => m.x !== null);
  const allX = pts.map((p) => p.x).concat(mk.map((m) => m.x));
  const xs = niceScale(Math.min.apply(null, allX), Math.max.apply(null, allX), 8);
  const ls = niceScale(0, Math.max.apply(null, lp.map((p) => p.l)), 5);
  const hasR = rp.length >= 2;
  const rs = hasR ? niceScale(Math.min.apply(null, rp.map((p) => p.r)) - 5, Math.max.apply(null, rp.map((p) => p.r)) + 5, 5) : null;
  const W = 640, H = 262, padL = 46, padR = hasR ? 48 : 16, padT = 28, padB = 42;
  const X = (v) => padL + ((v - xs.lo) / (xs.hi - xs.lo)) * (W - padL - padR);
  const YL = (v) => (H - padB) - ((v - ls.lo) / (ls.hi - ls.lo)) * (H - padB - padT);
  const YR = (v) => (H - padB) - ((v - rs.lo) / (rs.hi - rs.lo)) * (H - padB - padT);
  const path = (arr, key, Y) => arr.map((p, i) => `${i === 0 ? "M" : "L"} ${X(p.x).toFixed(1)} ${Y(p[key]).toFixed(1)}`).join(" ");
  const midY = (padT + H - padB) / 2;
  const band = mk.length >= 2 ? [Math.min(mk[0].x, mk[1].x), Math.max(mk[0].x, mk[1].x)] : null;
  return (
    <div style={{ marginTop: 10 }}>
      <svg viewBox={`0 0 ${W} ${H}`} width="100%" role="img" aria-label={ariaLabel} style={{ display: "block" }}>
        {band && <rect x={X(band[0])} y={padT} width={X(band[1]) - X(band[0])} height={H - padB - padT} fill={C.teal} opacity="0.07" />}
        {ls.ticks.map((t, i) => (
          <g key={`l${i}`}>
            <line x1={padL} x2={W - padR} y1={YL(t)} y2={YL(t)} stroke={C.line} />
            <text x={padL - 6} y={YL(t) + 3} textAnchor="end" fontSize="10" fill={leftColor}>{t}</text>
          </g>
        ))}
        {hasR && rs.ticks.map((t, i) => (
          <text key={`r${i}`} x={W - padR + 6} y={YR(t) + 3} textAnchor="start" fontSize="10" fill={rightColor}>{t}</text>
        ))}
        {xs.ticks.map((t, i) => (
          <text key={`x${i}`} x={X(t)} y={H - padB + 15} textAnchor="middle" fontSize="10" fill={C.inkFaint}>{t}</text>
        ))}
        <text x={(padL + W - padR) / 2} y={H - 8} textAnchor="middle" fontSize="11" fill={C.inkMuted}>{xLabel}</text>
        <text transform={`rotate(-90 12 ${midY})`} x="12" y={midY} textAnchor="middle" fontSize="11" fill={leftColor}>{leftLabel}</text>
        {hasR && <text transform={`rotate(90 ${W - 9} ${midY})`} x={W - 9} y={midY} textAnchor="middle" fontSize="11" fill={rightColor}>{rightLabel}</text>}
        {mk.map((m, i) => (
          <g key={`m${i}`}>
            <line x1={X(m.x)} x2={X(m.x)} y1={padT - 6} y2={H - padB} stroke={C.ink} strokeDasharray="4 3" opacity="0.55" />
            <text x={X(m.x)} y={padT - 11} textAnchor="middle" fontSize="10.5" fontWeight="700" fill={C.ink}>{m.label}</text>
          </g>
        ))}
        <path d={path(lp, "l", YL)} fill="none" stroke={leftColor} strokeWidth="2.5" strokeLinejoin="round" />
        {lp.map((p, i) => <circle key={`lc${i}`} cx={X(p.x)} cy={YL(p.l)} r="3.2" fill={leftColor} />)}
        {hasR && <path d={path(rp, "r", YR)} fill="none" stroke={rightColor} strokeWidth="2.5" strokeLinejoin="round" />}
        {hasR && rp.map((p, i) => <rect key={`rc${i}`} x={X(p.x) - 3} y={YR(p.r) - 3} width="6" height="6" fill={rightColor} />)}
      </svg>
      <div style={{ display: "flex", gap: 18, fontSize: 11.5, color: C.inkMuted, marginTop: 6, flexWrap: "wrap" }}>
        <span><span style={{ display: "inline-block", width: 18, height: 3, background: leftColor, marginRight: 6, verticalAlign: "middle", borderRadius: 2 }} />{leftLabel}</span>
        {hasR && <span><span style={{ display: "inline-block", width: 18, height: 3, background: rightColor, marginRight: 6, verticalAlign: "middle", borderRadius: 2 }} />{rightLabel}</span>}
      </div>
    </div>
  );
}

  const tile = (title, value, unit, sub) => (
