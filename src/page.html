                    const chips = (al, pace, hr) => (
                      <div style={{ display: "flex", flexDirection: "column", gap: 4, alignItems: al === "left" ? "flex-start" : "flex-end" }}>
                        {pace ? <span style={chip}>{pace === "Max" ? "All-out" : pace}{pace === "Max" ? null : <span style={small}> {unit}</span>}</span> : null}
                        {hr ? <span style={chip}><span style={{ color: C.teal }}>{"\u2665"}</span> {hr}{hr === "Max" ? null : <span style={small}> bpm</span>}</span> : null}
                      </div>
                    );
                    return (
                      <div>
                        <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 6 }}>
                          <span style={{ fontSize: 12, fontWeight: 700, color: C.ink, whiteSpace: "nowrap" }}>{z.zone} scale</span>
                          <div style={{ flex: 1, height: 1, background: C.line }} />
                        </div>
                        <div style={{ display: "flex", gap: 6 }}>
                          <div style={{ flex: 1, minWidth: 0 }}>
                            <div style={{ position: "relative", height: 84, borderRadius: 10, background: `linear-gradient(90deg, ${col}26, ${col})` }}>
                              <div style={{ position: "absolute", left: 10, top: "50%", transform: "translateY(-50%)" }}>{chips("left", pb && pb[0], hb && hb[0])}</div>
                              <div style={{ position: "absolute", right: 10, top: "50%", transform: "translateY(-50%)" }}>{chips("right", pb && pb[1], hb && hb[1])}</div>
                            </div>
                                                      </div>
                        </div>
                      </div>
                    );
          };
          return (
            <div key={i} className="avoid-break" style={{ border: `1px solid ${C.line}`, borderLeft: `4px solid ${col}`, borderRadius: 10, padding: "12px 14px", background: C.surface }}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", gap: 8, flexWrap: "wrap" }}>
                <div style={{ fontSize: 14, fontWeight: 700, color: C.ink }}>{z.zone} <span style={{ fontWeight: 500, color: C.inkMuted }}>· {z.name}</span></div>
              </div>
              {hasEnds ? (
                <div style={{ marginTop: 10 }}>
                  {scaleBlock("reps", z.durLow, z.durHigh)}
                  <div style={{ display: "flex", gap: 18, marginTop: 14, paddingTop: 12, borderTop: `1px dashed ${C.line}` }}>
                    {end("left", "Lower end", "longer efforts", pb && pb[0], hb && hb[0], z.durLow, dl, z.showEx === false ? "" : z.exLow, z.alsoLow)}
                    <div style={{ width: 1, background: C.line }} />
                    {end("right", "Upper end", "shorter efforts", pb && pb[1], hb && hb[1], z.durHigh, dh, z.showEx === false ? "" : z.exHigh, z.alsoHigh)}
                  </div>
                </div>
              ) : (
pb && hb ? <div style={{ marginTop: 10 }}>{scaleBlock("", "", "")}{hillBlock}</div> : (z.duration ? <div style={{ fontSize: 12.5, color: C.inkMuted, marginTop: 6 }}>Typical duration: {z.duration}</div> : null)
              )}
            </div>
          );
        })}
      </div>
    </div>
  );
}

function DefinitionBox({ term, children }) {
  return (
    <div className="avoid-break" style={{ background: C.bg, borderLeft: `4px solid ${C.teal}`, borderRadius: 8, padding: "10px 14px", margin: "10px 0 4px" }}>
      <div style={{ fontSize: 10.5, fontWeight: 700, letterSpacing: "0.08em", textTransform: "uppercase", color: C.teal, marginBottom: 3 }}>Definition</div>
      <div style={{ fontSize: 13, lineHeight: 1.55, color: C.ink }}><b>{term}</b> {children}</div>
    </div>
  );
}

function ThresholdMap({ showLactate, blood }) {
  const head = { padding: "8px 10px", fontSize: 11, fontWeight: 600, color: C.inkMuted, textAlign: "left", borderBottom: `1px solid ${C.inkFaint}`, verticalAlign: "bottom" };
  const cell = { padding: "10px 10px", fontSize: 12.5, color: C.ink, borderBottom: `1px solid ${C.line}`, verticalAlign: "top", lineHeight: 1.5 };
  const tag = (txt, col) => <span style={{ display: "inline-block", fontFamily: "'Space Grotesk', system-ui, sans-serif", fontWeight: 700, fontSize: 13, color: col, marginRight: 6 }}>{txt}</span>;
  const row = (title, sub, col, vt, lt, plain, vtNote, ltNote) => (
    <tr>
      <td style={{ ...cell, borderLeft: `4px solid ${col}`, width: "30%" }}>
        <div style={{ fontWeight: 700 }}>{title}</div>
        <div style={{ color: C.inkMuted, fontSize: 12 }}>{sub}</div>
        <div style={{ color: C.inkMuted, fontSize: 12, marginTop: 4 }}>{plain}</div>
      </td>
      <td style={cell}>{tag(vt, col)}<div style={{ color: C.inkMuted, fontSize: 12, marginTop: 2 }}>{vtNote}</div></td>
      {showLactate ? <td style={cell}>{tag(lt, col)}<div style={{ color: C.inkMuted, fontSize: 12, marginTop: 2 }}>{ltNote}</div></td> : null}
    </tr>
  );
  return (
    <div>
      <div style={{ overflowX: "auto", marginTop: 12 }}>
        <table style={{ width: "100%", borderCollapse: "collapse", minWidth: 420 }}>
          <thead>
            <tr>
              <th style={head}>The two turning points</th>
              <th style={head}>Found from your breathing<div style={{ fontWeight: 400 }}>Ventilatory threshold</div></th>
              {showLactate ? <th style={head}>{blood ? "Found from your blood" : "Estimated from your breathing"}<div style={{ fontWeight: 400 }}>Lactate threshold</div></th> : null}
            </tr>
          </thead>
          <tbody>
            {row("Threshold 1", "Aerobic threshold", C.blue, "VT1", "LT1", "The top of easy, comfortable effort. Below it you can keep going for hours.", "Breathing first starts to speed up faster than your effort.", "Blood lactate first lifts above your resting level.")}
            {row("Threshold 2", "Anaerobic threshold", C.coral, "VT2", "LT2", "The top of steady hard effort. Above it fatigue builds quickly.", "Breathing speeds up again, more steeply.", "Blood lactate climbs steeply and keeps rising.")}
          </tbody>
        </table>
      </div>
    </div>
  );
}

/* ---------- performance report view ---------- */
function PerformanceReportView({ client, results, perf, setPerf, onEdit, rawNotice }) {
  const isBike = results.testMode === "bike";
  const perfPr = resolvePercentile(perf.percentile, normLookup({ vo2: perf.vo2Ml, sex: client.sex, age: perf.age, mode: results.testMode }));
  const work = isBike ? "power" : "pace";
  const stages = (perf.stages || []).filter((s) => s.speed !== "" || s.hr !== "" || s.vo2 !== "");
  const vt1 = (perf.vt && perf.vt[0]) || {}, vt2 = (perf.vt && perf.vt[1]) || {};
  const lt1 = (perf.lt && perf.lt[0]) || {}, lt2 = (perf.lt && perf.lt[1]) || {};
  const lactateOn = perf.bloodLactate !== false;
  const rpeVals = stages.map((r) => num(r.rpe)).filter((v) => v !== null);
  const lastRpe = rpeVals.length ? rpeVals[rpeVals.length - 1] : null;
  const rerVals = stages.map((r) => num(r.rer)).filter((v) => v !== null);
  const maxRer = rerVals.length ? Math.max.apply(null, rerVals).toFixed(2) : "";
  const hasLactate = lactateOn && stages.filter((s) => num(s.lactate) !== null).length >= 2;
  const lactateShown = lactateOn && (hasLactate || !!lt1.pace || !!lt2.pace);
  const xLabel = isBike ? "Power (W)" : "Speed (km/h)";
  const vtMarkers = [{ x: paceToX(vt1.pace), label: "VT1" }, { x: paceToX(vt2.pace), label: "VT2" }];
  const ltMarkers = [{ x: paceToX(lt1.pace), label: "LT1" }, { x: paceToX(lt2.pace), label: "LT2" }];
  const diagramResults = { testMode: results.testMode, vo2max: perf.vo2Ml, hrPeak: perf.hrMax, testOutcome: results.testOutcome };
  const diagUnit = isBike ? "W" : "min/km";
  const diagRows = [
    { sub: [perf.vPace ? (isBike ? `${perf.vSpeed} W` : `${perf.vPace} min/km`) : "", perf.hrMax ? `${perf.hrMax} bpm` : ""].filter(Boolean).join(" · ") },
    { value: vt1.pace || "–", unit: diagUnit, sub: vt1.hr ? `${vt1.hr} bpm` : "" },
    { value: vt2.pace || "–", unit: diagUnit, sub: vt2.hr ? `${vt2.hr} bpm` : "" },
  ];
  const meta = [client.sex, perf.age ? `${perf.age} years` : "", perf.sport, client.height ? `${client.height} cm` : "", client.weight ? `${client.weight} kg` : ""]
    .filter(Boolean).join(" · ");
  const sec = { marginBottom: 28 };
  const hint = { fontSize: 13, color: C.inkMuted, margin: "4px 0 4px", lineHeight: 1.55 };
  const zoneCell = { padding: "8px 6px", fontSize: 12.5, color: C.ink, borderBottom: `1px solid ${C.line}`, textAlign: "left", verticalAlign: "top" };
  const zoneHead = { padding: "6px 6px", fontSize: 10.5, fontWeight: 600, color: C.inkMuted, textAlign: "left", verticalAlign: "bottom", borderBottom: `1px solid ${C.inkFaint}` };
  return (
    <div style={{ background: C.bg, minHeight: "100%" }}>
      <ReportToolbar onEdit={onEdit} />
      {rawNotice ? <div className="no-print" style={{ maxWidth: 720, margin: "12px auto 0", padding: "10px 14px", borderRadius: 10, background: "var(--amber-pale)", color: C.ink, fontSize: 13 }}>Values from the raw data sheet haven't been confirmed yet. Open Edit report and tick "I've checked these choices" in the Raw data check.</div> : null}
      <div className="report-sheet" style={{ maxWidth: 720, margin: "16px auto 60px", background: C.surface, border: `1px solid ${C.line}`, borderRadius: 14, padding: "36px 40px 40px" }}>
        <ReportHeader client={client} />

        <ClientDetails kicker="Performance assessment report for" name={client.name} items={[["Sex", client.sex], ["Age", perf.age ? `${perf.age} years` : ""], ["Sport", perf.sport], ["Height", client.height ? `${client.height} cm` : ""], ["Weight", client.weight ? `${client.weight} kg` : ""]]} />

        <VO2Hero results={{ vo2max: perf.vo2Ml, testOutcome: results.testOutcome }} category={perfPr ? { ...classify(perfPr.pct), label: perfPr.category } : classify("")} pr={perfPr} litres={perf.vo2L} />

        <TestDetails items={[
          [isBike ? "Power at VO2 max" : "Speed at VO2 max", perf.vSpeed ? (isBike ? `${perf.vSpeed} W` : `${perf.vSpeed} km/h`) : ""],
          ["Effort reached", lastRpe ? `${lastRpe} / 20` : ""],
          ["Breathing (RER)", maxRer ? String(maxRer) : ""],
        ]} />

        <div className={(perf.testDescription || perf.protocol) ? "avoid-break" : "no-print"} style={{ marginBottom: 28, padding: "14px 16px", background: C.bg, borderRadius: 10, fontSize: 12.5, lineHeight: 1.55, color: C.inkMuted }}>
          <div className="no-print" style={{ fontWeight: 700, color: C.ink, marginBottom: 4 }}>Test</div>
          <AutoGrowTextarea value={perf.testDescription || ""} onChange={(v) => setPerf((q) => ({ ...q, testDescription: v }))} placeholder="Describe the test that was done..." minHeight={44} fontSize={12.5} />
          {perf.testDescription ? <div className="print-only" style={{ display: "none" }}><b style={{ color: C.ink }}>Test: </b>{perf.testDescription}</div> : null}
          <div className="no-print" style={{ fontWeight: 700, color: C.ink, margin: "10px 0 4px" }}>Protocol</div>
          <AutoGrowTextarea value={perf.protocol || ""} onChange={(v) => setPerf((q) => ({ ...q, protocol: v }))} placeholder="Describe the test protocol..." minHeight={44} fontSize={12.5} />
          {perf.protocol ? <div className="print-only" style={{ display: "none", marginTop: 6 }}><b style={{ color: C.ink }}>Protocol: </b>{perf.protocol}</div> : null}
        </div>

        <div className="avoid-break" style={sec}>
          <div style={sectionTitleStyle}>How we measured it</div>
          <p style={hint}>
            {isBike ? "You cycled on a stationary bike" : "You ran on a treadmill"} wearing a breathing mask, which measured the oxygen you used and the carbon dioxide you breathed out.
          </p>
          <ResultsDiagram results={diagramResults} client={client} t1Label="VT1" t2Label="VT2" rowVals={diagRows} />
          {results.testOutcome === "peak" ? <PeakNote /> : null}
          <DefinitionBox term="Threshold 1 (Gas Exchange Threshold 1, or GET1)">is where the balance between the oxygen you use and the carbon dioxide you breathe out first shifts, which the mask measures breath by breath. It is linked to the upper limit of aerobic energy production, and in practice shows how well you tolerate long, moderate-intensity exercise.</DefinitionBox>
          <DefinitionBox term="Threshold 2 (Gas Exchange Threshold 2, or GET2)">is the second shift in that balance. It is linked to the upper limit of prolonged aerobic performance, where your body uses both aerobic and anaerobic energy while still coping with the by-products. In practice it is the highest intensity you can sustain for short to moderate durations.</DefinitionBox>
        </div>

        <div className="avoid-break" style={sec}>
          <div style={sectionTitleStyle}>Understanding your thresholds</div>
          <p style={hint}>
            As effort rises, your body passes two turning points. <b style={{ color: C.ink }}>Threshold 1</b> is where easy effort starts to become moderate, and <b style={{ color: C.ink }}>Threshold 2</b> is the limit of effort you can hold steadily.
            {hasLactate
              ? " We find each one in two different ways: from your breathing and from the lactate in your blood. They measure the same turning points through different signals, so when the two agree we can be more confident in your numbers."
              : ((lactateOn && (lt1.pace || lt2.pace)) ? " We find each one from your breathing: the ventilatory thresholds from how your breathing changes, and the lactate thresholds estimated from the same gas analysis, with no blood sample needed." : " We find each one from your breathing.")}
          </p>
          <ThresholdScale vt1={vt1} vt2={vt2} showLactate={lactateShown} isBike={isBike} />
          <div style={{ display: "flex", gap: 14, flexWrap: "wrap", fontSize: 12, color: C.inkMuted, marginTop: 10 }}>
            <div><b style={{ color: C.ink }}>VT</b> ventilatory threshold: found from your breathing</div>
            {lactateShown ? <div><b style={{ color: C.ink }}>LT</b> lactate threshold: {hasLactate ? "found from your blood" : "estimated from your breathing"}</div> : null}
          </div>
        </div>

        <div className="avoid-break" style={sec}>
          <div style={sectionTitleStyle}>How oxygen use and heart rate built up</div>
          <p style={hint}>
            As the {isBike ? "power" : "speed"} stepped up, oxygen use and heart rate climbed together. The dashed lines mark your two ventilatory thresholds, and the shaded band between them is your upper steady-state range.
          </p>
          <SpeedChart rows={stages} leftKey="vo2" leftLabel="Oxygen use (ml/kg/min)" leftColor={C.teal}
            rightKey="hr" rightLabel="Heart rate (bpm)" rightColor={C.blue} markers={vtMarkers} xLabel={xLabel}
            ariaLabel="Oxygen use and heart rate against speed, with ventilatory thresholds marked" />
          {perf.vSpeed ? (
          <p style={{ ...hint, marginTop: 14 }}>
            <b style={{ color: C.ink }}>Your {isBike ? "power" : "speed"} at VO2 max</b> is {isBike ? `${perf.vSpeed} W` : `${perf.vSpeed} km/h (${perf.vPace} min/km)`}.
            {isBike ? " It" : " This is called vVO2max, and it"} is a handy target for aerobic capacity intervals: training at or near it works your VO2 max hard and helps raise it. The higher it is, the better you tend to perform over most endurance distances.
          </p>
          ) : null}
        </div>

        <div style={sec}>
          <div style={sectionTitleStyle}>Ventilatory thresholds (VT1 / VT2): from your breathing</div>
          <DefinitionBox term="Ventilatory threshold">is a point where your breathing speeds up faster than your effort does. The mask measures how much air you move compared with the oxygen you use and the carbon dioxide you breathe out, and the shifts in that balance mark VT1 and VT2.</DefinitionBox>
          {((perf.veq1 || []).length + (perf.veq2 || []).length) >= 6
            ? <VentScatter veq1={perf.veq1} veq2={perf.veq2} vt1={parseClock(perf.vt1Time)} vt2={parseClock(perf.vt2Time)} />
            : stages.filter((r) => num(r.ve) !== null).length >= 2 && (
            <SpeedChart rows={stages} leftKey="ve" leftLabel="Ventilation (L/min)" leftColor={C.teal}
              rightKey="hr" rightLabel="Heart rate (bpm)" rightColor={C.blue} markers={vtMarkers} xLabel={xLabel}
              ariaLabel="Ventilation and heart rate against speed, with ventilatory thresholds marked" />
          )}
          <div style={{ display: "flex", gap: 12, flexWrap: "wrap", marginTop: 10 }}>
            <ThresholdCard label="VT1" name="Aerobic threshold" accent={C.blue} row={vt1} isBike={isBike}
              text={`Where your breathing first starts to rise faster than your effort. ${isBike ? "Power" : "Pace"} and heart rate at VT1 mark the boundary between recovery and steady endurance training.`} />
            <ThresholdCard label="VT2" name="Anaerobic threshold" accent={C.coral} row={vt2} isBike={isBike}
              text={"Where breathing climbs again, more steeply. This is the upper limit of steady-state effort: above it, heart rate and oxygen use cannot level off and fatigue arrives quickly. Widening the range you can hold below VT2 matters for every endurance athlete."} />
          </div>
        </div>

        {lactateShown && (
          <div style={sec}>
            <div style={sectionTitleStyle}>Lactate thresholds (LT1 / LT2): {hasLactate ? "from your blood" : "from your breathing"}</div>
            <p style={hint}>{hasLactate ? "These closely track your ventilatory thresholds. Same turning points, measured a different way." : "Estimated from the same breathing and gas analysis measurements, with no blood sample taken for this test."}</p>
            <DefinitionBox term="Lactate threshold">{hasLactate ? "is a point where lactate in your blood starts to build up. A small blood sample taken at the end of each stage shows where LT1 and LT2 sit." : "is a point where lactate in your blood is expected to start building up. It is estimated from the gas analysis of your breathing, so no blood sample is needed."}</DefinitionBox>
            <DefinitionBox term="Lactate">is a fuel by-product your muscles make whenever they work. At easy effort your body clears it as fast as it is made. As effort rises it is made faster than it is cleared, so it builds up in the blood.</DefinitionBox>
            {hasLactate && (
              <SpeedChart rows={stages} leftKey="lactate" leftLabel="Lactate (mmol/L)" leftColor={C.teal}
                rightKey="hr" rightLabel="Heart rate (bpm)" rightColor={C.blue} markers={ltMarkers} xLabel={xLabel}
                ariaLabel="Lactate and heart rate against speed, with lactate thresholds marked" />
            )}
            <div style={{ display: "flex", gap: 12, flexWrap: "wrap", marginTop: 14 }}>
              <ThresholdCard label="LT1" name="First rise in lactate" accent={C.blue} row={lt1} isBike={isBike}
                text="The first increase in blood lactate above your resting baseline. It usually lines up closely with VT1." />
              <ThresholdCard label="LT2" name="Steep rise in lactate" accent={C.coral} row={lt2} isBike={isBike}
                text="The second, sustained and steeper rise in blood lactate. It usually lines up closely with VT2." />
            </div>
          </div>
        )}

        <div className={perf.notes ? "" : "no-print"} style={sec}>
          <div style={sectionTitleStyle}>Physiologist's notes</div>
          <AutoGrowTextarea value={perf.notes} onChange={(v) => setPerf((p) => ({ ...p, notes: v }))} placeholder="Write your interpretation of this athlete's results here..." />
          <p className="print-only" style={{ display: "none", fontSize: 14.5, lineHeight: 1.6, color: C.ink, whiteSpace: "pre-wrap" }}>{perf.notes}</p>
        </div>

        {perf.zones && perf.zones.length > 0 && (
          <div className="avoid-break" style={sec}>
            <div style={sectionTitleStyle}>Your training zones</div>
            <p style={hint}>
              {lactateOn ? "Based on your own lactate and heart-rate responses." : "Based on your own heart-rate and breathing responses."} Use them to guide training intensity. If your coach has their own zone definitions, the raw data below can be used to recalculate them. Zones may need small adjustments for outdoor conditions.
            </p>
            <ZoneOverview zones={perf.zones} isBike={isBike} />
            {(perf.zones || []).some((z) => z.showEx !== false) ? <ZoneGuide zones={perf.zones} isBike={isBike} peakHr={results.testOutcome === "max" ? perf.hrMax : ""} /> : null}
          </div>
        )}

        {stages.length > 0 && (
          <div style={sec}>
            <div style={{ ...sectionTitleStyle, marginBottom: 10 }}>Full test data</div>
            <StageTable stages={stages} isBike={isBike} showLactate={lactateOn} />
          </div>
        )}

        <ReportFooter client={client} />
      </div>
    </div>
  );
}

/* ---------- performance report: form sections ---------- */
function PerformanceFormSections({ client, results, setResults, perf, setPerf }) {
  const upd = (k, v) => setPerf((p) => ({ ...p, [k]: v }));
  const updRow = (key, i, k, v) => setPerf((p) => ({ ...p, [key]: p[key].map((row, idx) => (idx === i ? { ...row, [k]: v } : row)) }));
  const addStage = () => setPerf((p) => ({ ...p, stages: [...p.stages, { speed: "", pace: "", hr: "", hrPct: "", vo2: "", vo2L: "", vo2Pct: "", rpe: "", lactate: "", ve: "", rer: "", rf: "", note: "" }] }));
  const removeStage = (i) => setPerf((p) => ({ ...p, stages: p.stages.filter((_, idx) => idx !== i) }));
  const isBike = results.testMode === "bike";
  const wl = isBike ? "Power (W)" : "Pace (min/km)";
  const small = { ...inputStyle, padding: "6px 6px", fontSize: 12.5, width: "100%", minWidth: 0 };
  const rowOf = (key, i) => (perf[key] && perf[key][i]) || {};
  const thresholdRow = (key, i, label, withPlus) => {
    const r = rowOf(key, i);
    const f = (title, k) => (<Field label={title}><input style={inputStyle} value={r[k] || ""} onChange={(e) => updRow(key, i, k, e.target.value)} /></Field>);
    return (
      <div key={`${key}${i}`} style={{ marginTop: 12 }}>
        <div style={{ fontSize: 12.5, fontWeight: 600, color: C.ink, marginBottom: 6 }}>{label}</div>
        <div style={{ display: "grid", gridTemplateColumns: `repeat(${withPlus ? 6 : 5}, 1fr)`, gap: 8 }}>
          {f("VO2 (ml/kg/min)", "vo2")}
          {withPlus && f("VO2 range (+)", "vo2Plus")}
          {f("% of VO2max", "pctVo2")}
          {f("HR (bpm)", "hr")}
          {f("% of HRmax", "pctHr")}
          {f(wl, "pace")}
        </div>
      </div>
    );
  };
  return (
    <React.Fragment>
      <section style={{ marginBottom: 28 }}>
        <div style={sectionTitleStyle}>Test and VO2 max</div>
        <div style={{ marginTop: 12 }}>
          <Field label="Test type">
            <div style={{ display: "flex", gap: 8 }}>
              {["treadmill", "bike"].map((mode) => (
                <button key={mode} onClick={() => setResults((r) => ({ ...r, testMode: mode }))} style={{
                  flex: 1, padding: "8px 0", borderRadius: 8, fontSize: 13, fontWeight: 600, cursor: "pointer",
                  border: `1px solid ${results.testMode === mode ? C.teal : C.line}`,
                  background: results.testMode === mode ? C.tealPale : C.surface,
                  color: results.testMode === mode ? C.teal : C.inkMuted, textTransform: "capitalize",
                }}>{mode}</button>
              ))}
            </div>
          </Field>
        </div>
        <div style={{ display: "flex", flexDirection: "column", gap: 12, marginTop: 12 }}>
          <Field label="Test description">
            <textarea style={{ ...inputStyle, minHeight: 56, resize: "vertical" }} value={perf.testDescription} onChange={(e) => upd("testDescription", e.target.value)} />
          </Field>
          <Field label="Protocol">
            <textarea style={{ ...inputStyle, minHeight: 72, resize: "vertical" }} value={perf.protocol} onChange={(e) => upd("protocol", e.target.value)} />
          </Field>
        </div>
        <div style={{ display: "grid", gridTemplateColumns: "repeat(3, 1fr)", gap: 8, marginTop: 12 }}>
          <Field label="VO2 max (ml/kg/min)"><input style={inputStyle} value={perf.vo2Ml} onChange={(e) => upd("vo2Ml", e.target.value)} /></Field>
          <Field label="Percentile override (blank = from tables)"><input style={inputStyle} value={perf.percentile || ""} onChange={(e) => upd("percentile", e.target.value)} placeholder={normHint(normLookup({ vo2: perf.vo2Ml, sex: client.sex, age: perf.age, mode: results.testMode }))} /></Field>
          <Field label="VO2 max (L/min)"><input style={inputStyle} value={perf.vo2L} onChange={(e) => upd("vo2L", e.target.value)} /></Field>
          <Field label="Max HR (bpm)"><input style={inputStyle} value={perf.hrMax} onChange={(e) => upd("hrMax", e.target.value)} /></Field>
          <Field label={isBike ? "Power at VO2 max (W)" : "Speed at VO2 max (km/h)"}><input style={inputStyle} value={perf.vSpeed} onChange={(e) => upd("vSpeed", e.target.value)} /></Field>
          <Field label={isBike ? "(not used)" : "Pace at VO2 max"}><input style={inputStyle} value={perf.vPace} onChange={(e) => upd("vPace", e.target.value)} /></Field>
        </div>
      </section>

      <section style={{ marginBottom: 28 }}>
        <div style={sectionTitleStyle}>Ventilatory thresholds</div>
        {thresholdRow("vt", 0, "VT1 (aerobic threshold)", true)}
        {thresholdRow("vt", 1, "VT2 (anaerobic threshold)", true)}
        <div style={{ marginTop: 14, padding: "10px 12px", border: `1px solid ${C.line}`, borderRadius: 10, background: C.surface }}>
          <div style={{ fontSize: 12.5, fontWeight: 600, color: C.ink }}>Ventilatory equivalents graph</div>
          <div style={{ fontSize: 12, color: C.inkFaint, margin: "3px 0 8px" }}>
            {((perf.veq1 || []).length + (perf.veq2 || []).length) >= 6
              ? `${(perf.veq1 || []).length} VE/VO2 and ${(perf.veq2 || []).length} VE/VCO2 points loaded. Importing a PDF reads these from its chart; you can also paste your own below.`
              : "No points yet. Importing a PDF reads them from its chart, or paste one row per line below: time, VE/VO2, VE/VCO2."}
          </div>
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8, marginBottom: 8 }}>
            <Field label="VT1 time (mm:ss)"><input style={inputStyle} value={perf.vt1Time == null || perf.vt1Time === "" ? "" : (typeof perf.vt1Time === "number" ? fmtClock(perf.vt1Time) : perf.vt1Time)} onChange={(e) => setPerf((p) => ({ ...p, vt1Time: e.target.value }))} placeholder="e.g. 12:40" /></Field>
            <Field label="VT2 time (mm:ss)"><input style={inputStyle} value={perf.vt2Time == null || perf.vt2Time === "" ? "" : (typeof perf.vt2Time === "number" ? fmtClock(perf.vt2Time) : perf.vt2Time)} onChange={(e) => setPerf((p) => ({ ...p, vt2Time: e.target.value }))} placeholder="e.g. 19:20" /></Field>
          </div>
          <textarea id="vent-paste" rows={3} placeholder={"00:10, 32.5, 36.1\n00:20, 31.8, 35.4"} style={{ ...inputStyle, width: "100%", boxSizing: "border-box", fontFamily: "inherit" }} />
          <div style={{ display: "flex", gap: 10, marginTop: 6 }}>
            <button onClick={() => { const el = document.getElementById("vent-paste"); const r = parseVentPaste(el ? el.value : ""); if (r.veq1.length + r.veq2.length >= 6) { setPerf((p) => ({ ...p, veq1: r.veq1, veq2: r.veq2 })); if (el) el.value = ""; } }} style={{ border: `1px solid ${C.line}`, background: C.bg, borderRadius: 8, padding: "5px 12px", fontSize: 12.5, fontWeight: 600, cursor: "pointer", color: C.ink }}>Use pasted points</button>
            <button onClick={() => setPerf((p) => ({ ...p, veq1: [], veq2: [] }))} style={{ border: "none", background: "none", color: C.teal, fontSize: 12.5, fontWeight: 600, cursor: "pointer" }}>Clear points</button>
          </div>
        </div>
      </section>

      <section style={{ marginBottom: 28 }}>
        <div style={sectionTitleStyle}>Lactate thresholds</div>
        <label style={{ display: "flex", alignItems: "flex-start", gap: 10, padding: "10px 12px", margin: "6px 0 10px", border: `1px solid ${C.line}`, borderRadius: 10, background: C.surface, cursor: "pointer" }}>
          <input type="checkbox" checked={perf.bloodLactate !== false} onChange={(e) => setPerf((p) => ({ ...p, bloodLactate: e.target.checked }))} style={{ width: 16, height: 16, marginTop: 2, accentColor: C.teal }} />
          <span><span style={{ fontSize: 13.5, fontWeight: 600, color: C.ink }}>Blood lactate was taken</span><span style={{ display: "block", fontSize: 12, color: C.inkFaint, marginTop: 2 }}>Untick to leave all lactate results (LT1 / LT2, the lactate chart and the lactate column) out of the report.</span></span>
        </label>
        {perf.bloodLactate !== false ? <React.Fragment>
          {thresholdRow("lt", 0, "LT1", false)}
          {thresholdRow("lt", 1, "LT2", false)}
        </React.Fragment> : null}
      </section>

      <section style={{ marginBottom: 28 }}>
        <div style={sectionTitleStyle}>Training zones</div>
        <p style={{ fontSize: 12, color: C.inkFaint, margin: "4px 0 12px" }}>Imported from the PDF where available. Zones 4 and 5 also get the clinic's standard effort lengths and example sessions; edit any box to change them.</p>
        <ZoneFormCards zones={perf.zones || []} onChange={(i, k, v) => updRow("zones", i, k, v)} isBike={isBike} showDuration={true} />
      </section>

      <section style={{ marginBottom: 28 }}>
        <div style={sectionTitleStyle}>Stage-by-stage results</div>
        <p style={{ fontSize: 12, color: C.inkFaint, margin: "4px 0 12px" }}>Powers the charts and the full data table. Leave a cell empty if it was not measured.</p>
        <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
          <div style={{ display: "grid", gridTemplateColumns: "repeat(12, minmax(0, 1fr)) 28px", gap: 4, fontSize: 10.5, color: C.inkFaint }}>
            {STAGE_COLS.map((c, i) => <div key={i}>{isBike && c.k === "speed" ? "Power" : c.h}<br />{isBike && c.k === "speed" ? "W" : c.u}</div>)}
            <div />
          </div>
          {(perf.stages || []).map((s, i) => (
            <div key={i} style={{ display: "grid", gridTemplateColumns: "repeat(12, minmax(0, 1fr)) 28px", gap: 4 }}>
              {STAGE_COLS.map((c) => (
                <input key={c.k} style={small} value={s[c.k] == null ? "" : s[c.k]} onChange={(e) => updRow("stages", i, c.k, e.target.value)} />
              ))}
              <button onClick={() => removeStage(i)} style={{ border: "none", background: "none", cursor: "pointer", color: C.inkFaint, padding: 0 }}><Icon name="Trash2" size={15} /></button>
            </div>
          ))}
        </div>
        <button onClick={addStage} style={{ display: "flex", alignItems: "center", gap: 6, marginTop: 10, border: "none", background: "none", color: C.teal, fontSize: 13, fontWeight: 600, cursor: "pointer", padding: 0 }}>
          <Icon name="Plus" size={15} /> Add row
        </button>
      </section>
    </React.Fragment>
  );
}



/* ---------- app ---------- */
function App() {
  const [view, setView] = usePersistedChoice("hpc-view", "report", ["report", "form"]);
  const [client, setClient] = useState(defaultClient);
  const [results, setResults] = useState(defaultResults);
  const [zones, setZones] = useState(defaultZones);
  const [recs, setRecs] = useState(defaultRecs);
  const [history, setHistory] = useState(defaultHistory);
  const [stages, setStages] = useState(defaultStages);
  const [summary, setSummary] = useState(defaultSummary);
  const [reportType, setReportType] = usePersistedChoice("hpc-report-type", "clinical", ["clinical", "performance"]);
  const [perf, setPerf] = useState(defaultPerf);
  const [importStatus, setImportStatus] = useState("idle");
  const [importMessage, setImportMessage] = useState("");

  const handleGenerate = () => setView("report");
  const handleInsertTemplate = () => {
    const pr0 = resolvePercentile(results.percentile, normLookup({ vo2: results.vo2max, sex: client.sex, age: ageAtTest(client.dob, client.testDate), mode: results.testMode }));
    const text = summaryTemplate({ client, results: { ...results, percentileText: pr0 ? pr0.text : results.percentile }, category: pr0 ? { label: pr0.category } : classify(results.percentile) });
    const el = document.getElementById("summary-box");
    let done = false;
    if (el) {
      try {
        // Typing-style insert so the browser's own undo (Cmd/Ctrl+Z) can bring the old text back
        el.focus();
        el.select();
        done = document.execCommand("insertText", false, text);
      } catch (err) { done = false; }
    }
    if (!done) setSummary(text);
  };

  const [raw, setRaw] = useState(null);
  const [rawPick, setRawPickState] = useState({ vo2: "sheet", hr: "exercise", power: false });
  const [rawConfirmed, setRawConfirmed] = useState(false);
  const applyRawValues = (r, pick, full) => {
    const v = rawToValues(r, pick);
    if (reportType === "performance") {
      setPerf((p) => ({ ...p, ...rawToPerf(r, pick, parseFloat(client.weight)), zones: p.zones, age: p.age }));
      setResults((x) => ({ ...x, vo2max: v.vo2max, hrPeak: v.hrPeak }));
      return;
    }
    setResults((x) => ({ ...x, ...v }));
    setStages(rawToStages(r, pick.power));
  };
  const setRawPick = (pick) => { setRawPickState(pick); if (raw) applyRawValues(raw, pick, false); setRawConfirmed(false); };
  const handleImportRaw = async (file) => {
    const reportTypeNow = reportType;
    setImportStatus("parsing"); setImportMessage("");
    try {
      const r = await readRawSheet(file);
      const pick = { vo2: r.cand.sheet ? "sheet" : "b60", hr: "exercise", power: false };
      const modeTxt = String((r.meta["Ergometer"] || "") + " " + (r.meta["Protocol"] || ""));
      const mode = /tread|run/i.test(modeTxt) ? "treadmill" : /bike|cycle|watt/i.test(modeTxt) ? "bike" : null;
      setRaw(r); setRawPickState(pick); setRawConfirmed(false);
      setClient((c) => ({ ...c, name: r.name || c.name, sex: r.meta["Gender"] || c.sex, dob: r.meta["D.O.B."] || c.dob,
        height: r.meta["Height (cm)"] != null ? String(r.meta["Height (cm)"]) : c.height, weight: r.meta["Weight (kg)"] != null ? String(r.meta["Weight (kg)"]) : c.weight,
        testDate: r.testDateText || c.testDate, reportDate: "" }));
      setResults((x) => ({ ...x, testMode: mode || x.testMode, percentile: "", maxSpeed: "", maxIncline: "", rpe: "", hrPredictedPct: "", hrRecovery3: "", testOutcome: "",
        get1Pace: "", get2Pace: "", get1Hr: "", get2Hr: "", peakPace: "", ...rawToValues(r, pick) }));
      setStages(rawToStages(r, false));
      setZones((zs) => zs.map((z) => ({ ...z, pace: "", hr: "" })));
      setRecs([]); setSummary(""); setHistory("");
      if (reportType === "performance") {
        const ageNum = r.meta["Age"] != null ? String(Math.floor(Number(r.meta["Age"]))) : "";
        setPerf((p) => ({ ...p, ...rawToPerf(r, pick, parseFloat(r.meta["Weight (kg)"])), age: ageNum || p.age, zones: p.zones.map((z) => ({ ...z, pace: "", hr: "" })) }));
      }
      setImportStatus("done");
      setImportMessage(`Read the raw data sheet${mode ? ` (${mode === "bike" ? "cycle" : "treadmill"} test)` : " — couldn't tell if this was a bike or treadmill test, please set it"}. Check the choices in the panel below.`);
    } catch (err) {
      setImportStatus("error"); setImportMessage("Couldn't read that file: " + (err && err.message ? err.message : "unknown error"));
    }
  };
  const handleImportPdf = async (file) => {
    setImportStatus("parsing");
    setImportMessage("");
    try {
      const raw = await extractPdfLines(file);
      const full = cleanPdfText(raw);
      const detected = detectReportType(full);
      if (detected === "performance") {
        const pp = parsePerformanceReport(full);
        const vent = await extractVentEquivalents(file);
        let n = 0;
        setClient((c) => {
          const next = { ...c };
          ["name", "sex", "height", "weight", "tester", "testDate"].forEach((k) => { if (pp.client[k]) { next[k] = pp.client[k]; n++; } });
          return next;
        });
        setPerf((p) => {
          const next = { ...p };
          Object.keys(pp.perf).forEach((k) => {
            const v = pp.perf[k];
            if (k === "zones" && Array.isArray(v) && v.length > 0) {
              next.zones = v.map((z, zi) => {
                const d = defaultPerf.zones[zi] || {};
                return d.durLow ? { ...z, durLow: d.durLow, durHigh: d.durHigh, exLow: d.exLow, exHigh: d.exHigh, alsoLow: d.alsoLow, alsoHigh: d.alsoHigh, duration: d.duration } : (d.alsoLow ? { ...z, alsoLow: d.alsoLow, alsoHigh: d.alsoHigh } : z);
              });
              n++;
            } else if (Array.isArray(v) ? v.length > 0 : v) { next[k] = v; n++; }
          });
          if (vent) { next.veq1 = vent.veq1; next.veq2 = vent.veq2; next.vt1Time = vent.vt1Time; next.vt2Time = vent.vt2Time; }
          {
            const ltRows = Array.isArray(pp.perf.lt) ? pp.perf.lt : [];
            const stRows = Array.isArray(pp.perf.stages) ? pp.perf.stages : [];
            next.bloodLactate = ltRows.some((r) => r && r.pace) || stRows.filter((r) => r && r.lactate !== "" && r.lactate != null).length >= 2;
          }
          return next;
        });
        if (pp.testMode) setResults((r) => ({ ...r, testMode: pp.testMode }));
        setReportType("performance");
        setImportStatus("done");
        setImportMessage(n > 0
          ? "Performance report detected — please review every field below before generating the report."
          : "Looks like a performance report but no fields were recognised. You can enter details manually below.");
        setView("form");
        return;
      }
      setReportType("clinical");
      const parsed = parseReportText(full);
      const stagesParsed = parseStages(full);
      const recsParsed = parseRecommendations(full);
      let count = 0;
      setClient((c) => {
        const next = { ...c };
        if (parsed.name) { next.name = parsed.name; count++; }
        if (parsed.dob) { next.dob = parsed.dob; count++; }
        if (parsed.reportDate) { next.reportDate = parsed.reportDate; count++; }
        if (parsed.testDate) { next.testDate = parsed.testDate; count++; }
        if (parsed.height) { next.height = parsed.height; count++; }
        if (parsed.weight) { next.weight = parsed.weight; count++; }
        return next;
      });
      setResults((r) => {
        const next = { ...r, testMode: parsed.testMode || r.testMode, get1Pace: "", get1Hr: "", get2Pace: "", get2Hr: "", peakPace: "" };
        ["vo2max", "hrPeak", "hrPredictedPct", "maxSpeed", "maxIncline", "rpe",
          "get1", "get1Pct", "get2", "get2Pct", "rer", "hrRecovery1", "hrRecovery3", "testDuration"]
          .forEach((k) => { if (parsed[k]) { next[k] = parsed[k]; count++; } });
        return next;
      });
      if (parsed.history) { setHistory(parsed.history); count++; }
      if (parsed.summary) { setSummary(parsed.summary); count++; }
      if (recsParsed) { setRecs(recsParsed); count++; }
      if (stagesParsed) {
        setStages(stagesParsed); count++;
        if (parsed.maxSpeed) {
          const peak = (parsed.testMode || "treadmill") === "bike" ? String(Math.round(Number(parsed.maxSpeed))) : paceFromSpeed(parsed.maxSpeed);
          if (peak) setResults((r) => ({ ...r, peakPace: peak }));
        }
      }
      setImportStatus("done");
      setImportMessage(count > 0
        ? `Imported data from the PDF — please review every field below before generating the report.`
        : `Couldn't find recognizable fields in that PDF. You can still enter details manually below.`);
      setView("form");
    } catch (err) {
      console.error(err);
      setImportStatus("error");
      setImportMessage("Couldn't read that PDF automatically. You can still enter details manually below.");
      setView("form");
    }
  };

  return (
    <div style={{ minHeight: "100vh", background: C.bg }}>
      {view === "form" ? (
        <ReportForm client={client} setClient={setClient} results={results} setResults={setResults}
          zones={zones} setZones={setZones} recs={recs} setRecs={setRecs} history={history} setHistory={setHistory}
          stages={stages} setStages={setStages} onGenerate={handleGenerate} onImportPdf={handleImportPdf} onImportRaw={handleImportRaw} raw={raw} rawPick={rawPick} setRawPick={setRawPick} rawConfirmed={rawConfirmed} setRawConfirmed={setRawConfirmed}
          importStatus={importStatus} importMessage={importMessage}
          reportType={reportType} setReportType={setReportType} perf={perf} setPerf={setPerf} />
      ) : reportType === "performance" ? (
        <PerformanceReportView client={client} results={results} perf={perf} setPerf={setPerf} onEdit={() => setView("form")} rawNotice={raw && !rawConfirmed} />
      ) : (
        <ReportView client={client} results={results} zones={zones} recs={recs} history={history} stages={stages}
          summary={summary} setSummary={setSummary} onEdit={() => setView("form")} onInsertTemplate={handleInsertTemplate} rawNotice={raw && !rawConfirmed} />
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
